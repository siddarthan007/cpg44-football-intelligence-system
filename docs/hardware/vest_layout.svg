<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="Archivo, Helvetica, Arial, sans-serif">
  <title>CPG44 sensor vest: back and front layout</title>
  <rect width="1400" height="800" fill="#f4f0e6"/>
  <text x="40" y="52" font-size="28" font-weight="800" fill="#1d2421">CPG44 sensor vest · layout</text>
  <text x="40" y="78" font-size="14" fill="#4c534e">Compression vest worn under the playing shirt. Dimensions in mm, size M. Not to scale between views.</text>

  <!-- ===== BACK VIEW ===== -->
  <g transform="translate(70,110)">
    <text x="190" y="0" font-size="16" font-weight="700" fill="#1d2421" text-anchor="middle">BACK</text>
    <!-- vest body (racer-back compression) -->
    <path d="M110 30 C130 20 150 18 170 30 L190 60 L210 30 C230 18 250 20 270 30 L330 70 L345 210 L330 560 C300 585 80 585 50 560 L35 210 L50 70 Z"
          fill="#2b3530" stroke="#1d2421" stroke-width="2"/>
    <!-- mesh ventilation panels -->
    <path d="M60 230 L120 230 L110 520 L62 520 Z" fill="#3a4640" opacity=".9"/>
    <path d="M320 230 L260 230 L270 520 L318 520 Z" fill="#3a4640" opacity=".9"/>
    <g stroke="#56645c" stroke-width=".8">
      <path d="M65 250 H115 M64 280 H114 M63 310 H113 M63 340 H112 M63 370 H112 M63 400 H111 M63 430 H111 M63 460 H110 M63 490 H110"/>
      <path d="M265 250 H315 M266 280 H316 M266 310 H317 M267 340 H317 M267 370 H317 M268 400 H317 M268 430 H317 M269 460 H317 M269 490 H317"/>
    </g>
    <!-- seams -->
    <path d="M190 60 L190 560" stroke="#1d2421" stroke-dasharray="5 5" stroke-width="1"/>
    <!-- pocket between scapulae -->
    <rect x="140" y="95" width="100" height="62" rx="9" fill="#1d2421" stroke="#f2b705" stroke-width="2"/>
    <rect x="148" y="102" width="84" height="48" rx="7" fill="#e8e3d6"/>
    <rect x="160" y="108" width="34" height="20" rx="2" fill="#c9c2b0" stroke="#1d2421" stroke-width="1"/>
    <text x="177" y="122" font-size="8" text-anchor="middle" fill="#1d2421">GNSS</text>
    <circle cx="214" cy="118" r="5" fill="#2251a3"/>
    <!-- IMU axes -->
    <g transform="translate(214,140)" stroke-width="2" fill="none">
      <path d="M0 0 H22" stroke="#d1492e"/><path d="M0 0 V-22" stroke="#2e7048"/>
      <circle r="3" fill="#1d2421" stroke="none"/>
    </g>
    <text x="238" y="142" font-size="9" fill="#d1492e">x</text>
    <text x="210" y="114" font-size="9" fill="#2e7048">y</text>
    <!-- cable channel over left shoulder to front PPG pad -->
    <path d="M150 150 C120 150 100 120 100 80 L110 32" fill="none" stroke="#b0306a" stroke-width="3" stroke-dasharray="7 4"/>
    <!-- silicone gripper band -->
    <path d="M52 548 C90 570 290 570 328 548" fill="none" stroke="#f2b705" stroke-width="4" opacity=".8"/>

    <!-- callouts -->
    <g font-size="12.5" fill="#1d2421">
      <path d="M240 115 L400 70" stroke="#1d2421" stroke-width="1"/>
      <text x="405" y="62" font-weight="700">1 · Sensor pod pocket</text>
      <text x="405" y="78">between the scapulae, T2–T4 level</text>
      <text x="405" y="93">95 × 55 × 20 mm, sky-facing GNSS</text>
      <path d="M232 140 L400 150" stroke="#1d2421" stroke-width="1"/>
      <text x="405" y="145" font-weight="700">2 · IMU on the pod board</text>
      <text x="405" y="161">fixed orientation every session</text>
      <path d="M105 90 L-10 60" stroke="#1d2421" stroke-width="1"/>
      <text x="-60" y="40" font-weight="700">3 · Cable channel</text>
      <text x="-60" y="55">flat 6-way, inside seam</text>
      <path d="M90 330 L-10 330" stroke="#1d2421" stroke-width="1"/>
      <text x="-60" y="315" font-weight="700">4 · Mesh</text>
      <text x="-60" y="330">ventilation</text>
      <path d="M190 566 L190 600" stroke="#1d2421" stroke-width="1"/>
      <text x="120" y="618" font-weight="700">5 · Silicone hem gripper</text>
      <text x="120" y="633">stops the vest riding up</text>
    </g>
  </g>

  <!-- ===== FRONT VIEW ===== -->
  <g transform="translate(760,110)">
    <text x="190" y="0" font-size="16" font-weight="700" fill="#1d2421" text-anchor="middle">FRONT</text>
    <path d="M110 30 C140 70 240 70 270 30 L330 70 L345 210 L330 560 C300 585 80 585 50 560 L35 210 L50 70 Z"
          fill="#2b3530" stroke="#1d2421" stroke-width="2"/>
    <path d="M190 64 L190 560" stroke="#1d2421" stroke-dasharray="5 5" stroke-width="1"/>
    <!-- cable entering from left shoulder (wearer's left = viewer's right) -->
    <path d="M270 32 L262 90 C258 120 250 150 245 168" fill="none" stroke="#b0306a" stroke-width="3" stroke-dasharray="7 4"/>
    <!-- PPG pad on wearer's left upper chest -->
    <rect x="215" y="165" width="56" height="40" rx="10" fill="#b0306a" stroke="#1d2421" stroke-width="1.5"/>
    <rect x="232" y="176" width="22" height="18" rx="3" fill="#1d2421"/>
    <circle cx="243" cy="185" r="4" fill="#d1492e"/>
    <!-- elastic chest band behind pad -->
    <path d="M45 200 C120 215 260 215 340 200" fill="none" stroke="#f2b705" stroke-width="3" opacity=".7"/>
    <!-- size / ID label and charge mark -->
    <rect x="100" y="470" width="70" height="34" rx="4" fill="#e8e3d6"/>
    <text x="135" y="492" font-size="11" text-anchor="middle" fill="#1d2421">VEST 07</text>
    <g font-size="12.5" fill="#1d2421">
      <path d="M271 185 L400 150" stroke="#1d2421" stroke-width="1"/>
      <text x="405" y="140" font-weight="700">6 · Optical pulse pad</text>
      <text x="405" y="156">left pectoral, 4 cm below clavicle</text>
      <text x="405" y="171">light-shielded, silicone skin seal</text>
      <path d="M330 202 L400 230" stroke="#1d2421" stroke-width="1"/>
      <text x="405" y="230" font-weight="700">7 · Elastic chest band</text>
      <text x="405" y="246">12–15 mmHg contact pressure</text>
      <path d="M170 487 L400 470" stroke="#1d2421" stroke-width="1"/>
      <text x="405" y="465" font-weight="700">8 · Vest ID</text>
      <text x="405" y="481">matches the paired player</text>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(40,772)" font-size="13" fill="#1d2421">
    <rect width="14" height="14" fill="#2b3530"/><text x="20" y="12">compression fabric 78% PA / 22% EA</text>
    <rect x="290" width="14" height="14" fill="#3a4640"/><text x="310" y="12">open mesh</text>
    <line x1="420" y1="7" x2="450" y2="7" stroke="#b0306a" stroke-width="3" stroke-dasharray="7 4"/><text x="456" y="12">sensor harness</text>
    <rect x="600" width="14" height="14" fill="#f2b705"/><text x="620" y="12">silicone grip</text>
    <rect x="740" width="14" height="14" fill="#b0306a"/><text x="760" y="12">pulse (vest-only data)</text>
  </g>
</svg>
