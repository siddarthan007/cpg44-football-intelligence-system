# Calibration for SNMOT-060 (kickoff view, frame 0 of demo/sample_match.mp4).
# Landmarks were read from 4x-5x zoomed crops of the exact pipeline start frame:
# centre spot under the kickoff ball, the four visible centre-circle cardinals,
# the far touchline where it meets the halfway line, and two touchline samples
# either side. The near touchline is below the frame bottom, so the vertical
# scale is anchored by the full circle ellipse (top arc 77 px for 9.15 m, bottom
# arc 130 px) plus the far touchline.
points:
  centre:        [959, 551]
  circle_left:   [449, 580]
  circle_right:  [1489, 575]
  circle_top:    [962, 474]
  circle_bottom: [962, 681]
lines:
  far_touchline:
    - [380, 320]
    - [962, 322]
    - [1590, 319]
  halfway:
    - [962, 400]
    - [968, 1030]
