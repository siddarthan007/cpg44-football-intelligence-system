# Calibration for SNMOT-060 (kickoff view). Point landmarks are the centre
# circle; the `lines:` section anchors the homography at the frame edges via
# points ON known pitch lines (far touchline = y0, halfway = x52.5), which fixes
# the sideline→centre compression that a circle-only fit suffers.
# Halfway-line pixels were auto-detected (x = 0.00247·y + 960.9); the touchline
# runs through the halfway intersection (962, 315) with slope ≈ 0.0112.
